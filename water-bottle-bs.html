<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Bottles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .product-card {
            border: none;
        }

        .product-card img {
            height: 320px;
            object-fit: contain;
        }

        .rating {
            background-color: green;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .old-price {
            text-decoration: line-through;
            color: gray;
        }

        .discount {
            color: green;
            font-weight: bold;
        }

        .stock {
            color: deeppink;
            font-weight: 500;
        }

        .heart {
            float: right;
            color: lightgray;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-md-4">
                <div class="card product-card">
                    <span class="heart">♡</span>

                    <img src="image\skylifebottle.webp" class="card-img-top">

                    <div class="card-body px-0">
                        <h5 class="card-title">
                            SKYLIFE Smart Buy Premium Quality Water Bottle
                        </h5>

                        <p>
                            <span class="rating">4★</span>
                            <span class="text-muted ms-2">(2,020)</span>
                        </p>

                        <h4>
                            ₹118
                            <span class="old-price fs-5">₹599</span>
                            <span class="discount fs-6">80% off</span>
                        </h4>

                        <p class="stock">Only few left</p>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-md-4">
                <div class="card product-card">
                    <span class="heart">♡</span>

                    <img src="image\elinorbottle.webp" class="card-img-top">

                    <div class="card-body px-0">
                        <h5 class="card-title">
                            ELINOR AMAZING SINGLE WALL STAINLESS STEEL
                        </h5>

                        <p>
                            <span class="rating">4.1★</span>
                            <span class="text-muted ms-2">(16,395)</span>
                        </p>

                        <h4>
                            ₹178
                            <span class="old-price fs-5">₹499</span>
                            <span class="discount fs-6">64% off</span>
                        </h4>

                        <p class="stock">Only few left</p>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-md-4">
                <div class="card product-card">
                    <span class="heart">♡</span>

                    <img src="image\dfitbottle.webp" class="card-img-top">

                    <div class="card-body px-0">
                        <h5 class="card-title">
                            DFit 2 Liter Transparent Motivational Bottle
                        </h5>

                        <p>
                            <span class="rating">4.1★</span>
                            <span class="text-muted ms-2">(23,274)</span>
                        </p>

                        <h4>
                            ₹164
                            <span class="old-price fs-5">₹1,288</span>
                            <span class="discount fs-6">87% off</span>
                        </h4>

                        <p class="stock">Only few left</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
